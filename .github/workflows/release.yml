name: Release

# Stages every package version that isn't on npm yet, with provenance, through npm trusted
# publishing (OIDC): no npm token is stored in the repo. Staged versions go live only when a
# maintainer approves them on npmjs.com (or `npm stage approve <id>`), with 2FA.
# Each package needs this repo, release.yml and the `npm` environment as a trusted publisher.
# Bump the versions in a PR, merge it, then run this from the Actions tab.
on:
  workflow_dispatch:
    inputs:
      package:
        description: "Only this package (e.g. stdartifacts); empty stages every unpublished one"
        required: false
        default: ""

permissions:
  contents: read
  id-token: write

jobs:
  stage:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: npm
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org
      # `npm stage publish` arrived in npm 12.
      - run: npm install -g npm@12.2.3
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm pack-check
      # pnpm packs (it fills in workspace: versions and publishConfig); npm stages the tarball.
      # Dependencies come first, so they're staged before what needs them.
      - name: Stage unpublished versions
        env:
          NPM_CONFIG_PROVENANCE: "true"
          ONLY: ${{ inputs.package }}
        run: |
          set -euo pipefail
          for dir in packages/protocol packages/client packages/mcp packages/server apps/cli; do
            name=$(node -p "require('./$dir/package.json').name")
            version=$(node -p "require('./$dir/package.json').version")
            if [ -n "$ONLY" ] && [ "$name" != "$ONLY" ]; then continue; fi
            if npm view "$name@$version" version >/dev/null 2>&1; then
              echo "$name@$version is already on npm"
              continue
            fi
            out="$RUNNER_TEMP/pack/$(echo "$name" | tr '/@' '__')"
            mkdir -p "$out"
            (cd "$dir" && pnpm pack --pack-destination "$out" >/dev/null)
            npm stage publish "$out"/*.tgz --access public
            echo "Staged $name@$version"
          done
