name: Release

# Publishes every package whose version isn't on npm yet, with provenance, through npm trusted
# publishing (OIDC): no npm token is stored in the repo. Each package needs this repo and
# workflow added as a trusted publisher on npmjs.com (package → Settings → Trusted publishing).
# Bump the versions in a PR, merge it, then run this from the Actions tab.
on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: npm
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org
      # Trusted publishing needs npm 11.5.1 or later; pnpm hands the packed tarball to npm.
      - run: npm install -g npm@11.12.1
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm pack-check
      # pnpm skips any package whose current version is already published.
      - run: pnpm -r publish --access public --no-git-checks
        env:
          NPM_CONFIG_PROVENANCE: "true"
          # Shows the OIDC exchange with npm, so a trusted-publisher mismatch is visible in the log.
          NPM_CONFIG_LOGLEVEL: verbose
