name: CLA

# Contributors sign CLA.md once, by commenting the sign phrase on their pull request.
# Signatures are kept in signatures/cla.json on the cla-signatures branch.
# This runs on pull_request_target so it can comment on PRs from forks; it never checks out
# or runs the pull request's code.
on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request_target' || github.event.comment.body == 'recheck' || github.event.comment.body == 'I have read CLA.md and I hereby sign the CLA'
    steps:
      - uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08 # v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-document: https://github.com/juancgarza/standard-artifacts/blob/main/CLA.md
          path-to-signatures: signatures/cla.json
          branch: cla-signatures
          allowlist: juancgarza,dependabot[bot],renovate[bot],github-actions[bot]
          custom-pr-sign-comment: I have read CLA.md and I hereby sign the CLA
          custom-notsigned-prcomment: >-
            Thanks for the pull request! Before it can be merged, please read the
            [Contributor License Agreement](https://github.com/juancgarza/standard-artifacts/blob/main/CLA.md)
            and sign it by commenting the line below. You only sign once, and it covers your future contributions.
          custom-allsigned-prcomment: Everyone on this pull request has signed the CLA. Thank you!
          signed-commit-message: "CLA: $contributorName signed in #$pullRequestNo"
          create-file-commit-message: "CLA: start the signature list"
