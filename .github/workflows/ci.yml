name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      # Packs the npm packages (protocol, client, mcp, stdartifacts), installs the tarballs
      # into a fresh project outside the repo and checks they import, run and typecheck.
      - run: pnpm pack-check
      # Starts the app locally (alchemy dev: workerd + Vite) and runs the API, CLI/MCP
      # and two-browser UI suites against it. ubuntu-latest ships Google Chrome.
      - run: pnpm test
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: app-log
          path: .test-app.log
          if-no-files-found: ignore
