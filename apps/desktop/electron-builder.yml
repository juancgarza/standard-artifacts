appId: com.standardartifacts.desktop
productName: Standard Artifacts
directories:
  output: release
  # icon.png (1024px, from scripts/brand.mjs): electron-builder makes the .icns and .ico from it.
  buildResources: build
# No spaces, so release downloads keep their names: Standard-Artifacts-0.1.0-mac-arm64.dmg.
artifactName: Standard-Artifacts-${version}-${os}-${arch}.${ext}
files:
  - dist/**
  - package.json
protocols:
  - name: Standard Artifacts
    schemes: [stdartifacts]
# Turn off the ways another local process could run code as this app.
electronFuses:
  runAsNode: false
  enableCookieEncryption: true
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  enableEmbeddedAsarIntegrityValidation: true
  onlyLoadAppFromAsar: true
  grantFileProtocolExtraPrivileges: false
mac:
  icon: build/icon.png
  category: public.app-category.productivity
  hardenedRuntime: true
  target:
    - target: dmg
      arch: [arm64, x64]
win:
  icon: build/icon.png
  target: nsis
linux:
  icon: build/icon.png
  category: Office
  target: AppImage
