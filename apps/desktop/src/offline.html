<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; connect-src http: https:" />
    <title>Can't connect</title>
    <style>
      :root { color-scheme: light dark; --bg: #ffffff; --text: #1f1f1d; --muted: #73736e; --hover: #ececea; --border: #e6e6e3; }
      @media (prefers-color-scheme: dark) {
        :root { --bg: #191918; --text: #ececea; --muted: #9b9b96; --hover: #2a2a29; --border: #2e2e2d; }
      }
      html, body { height: 100%; margin: 0; }
      body { display: grid; place-items: center; background: var(--bg); color: var(--text); font: 14px/1.5 system-ui, sans-serif; -webkit-app-region: drag; }
      main { max-width: 340px; padding: 16px; text-align: center; }
      h1 { margin: 0 0 4px; font-size: 16px; font-weight: 600; }
      p { margin: 0 0 16px; color: var(--muted); }
      a { display: inline-block; padding: 5px 12px; border: 1px solid var(--border); border-radius: 6px; color: inherit; text-decoration: none; -webkit-app-region: no-drag; }
      a:hover { background: var(--hover); }
    </style>
  </head>
  <body>
    <main>
      <h1>Can't connect to Standard Artifacts</h1>
      <p>Your work is safe. This window will reconnect as soon as it can.</p>
      <a id="retry" href="#">Try again</a>
    </main>
    <script>
      const url = decodeURIComponent(location.hash.slice(1))
      document.getElementById("retry").href = url
      setInterval(() => {
        fetch(url, { mode: "no-cors", cache: "no-store" }).then(() => location.replace(url), () => {})
      }, 3000)
    </script>
  </body>
</html>
