<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; connect-src http: https:" />
    <title>Can't connect</title>
    <style>
      :root { color-scheme: light dark; --bg: #ffffff; --text: #1f1f1d; --muted: #73736e; --hover: #ececea; --border: #e6e6e3; --soft: #f4f4f2; }
      @media (prefers-color-scheme: dark) {
        :root { --bg: #191918; --text: #ececea; --muted: #9b9b96; --hover: #2a2a29; --border: #2e2e2d; --soft: #222221; }
      }
      html, body { height: 100%; margin: 0; }
      body { display: grid; place-items: center; background: var(--bg); color: var(--text); font: 14px/1.5 system-ui, sans-serif; -webkit-app-region: drag; }
      main { max-width: 360px; padding: 16px; text-align: center; }
      h1 { margin: 0 0 4px; font-size: 16px; font-weight: 600; }
      p { margin: 0 0 16px; color: var(--muted); }
      .cmd { display: flex; gap: 8px; align-items: center; justify-content: space-between; margin: 0 0 16px; padding: 6px 6px 6px 12px; border: 1px solid var(--border); border-radius: 8px; background: var(--soft); text-align: left; -webkit-app-region: no-drag; user-select: text; }
      code { font: 13px ui-monospace, Menlo, monospace; }
      .actions { display: flex; gap: 8px; justify-content: center; }
      a, button { display: inline-block; padding: 5px 12px; border: 1px solid var(--border); border-radius: 6px; background: none; color: inherit; font: inherit; text-decoration: none; cursor: pointer; -webkit-app-region: no-drag; }
      a:hover, button:hover { background: var(--hover); }
      [hidden] { display: none !important; }
    </style>
  </head>
  <body>
    <main>
      <h1 id="title">Can't connect to Standard Artifacts</h1>
      <p id="detail">Your work is safe. This window will reconnect as soon as it can.</p>
      <div class="cmd" id="cmd" hidden><code>npx stdartifacts serve</code><button type="button" id="copy">Copy</button></div>
      <div class="actions">
        <a id="retry" href="#">Try again</a>
        <a href="https://desktop.stdartifacts.invalid/choose">Switch workspace</a>
      </div>
    </main>
    <script>
      // #<json>: the page it was loading, and which kind of workspace that is.
      const { url, kind, label } = JSON.parse(decodeURIComponent(location.hash.slice(1)))
      document.getElementById("retry").href = url
      if (kind === "local") {
        document.getElementById("title").textContent = "This computer's server isn't running"
        document.getElementById("detail").textContent = "Start it in a terminal and this window connects by itself. Your work stays on this computer."
        document.getElementById("cmd").hidden = false
        document.getElementById("copy").addEventListener("click", (event) => {
          const range = document.createRange()
          range.selectNodeContents(document.querySelector("#cmd code"))
          getSelection().removeAllRanges()
          getSelection().addRange(range)
          document.execCommand("copy")
          getSelection().removeAllRanges()
          event.target.textContent = "Copied"
        })
      } else if (label) {
        document.getElementById("title").textContent = "Can't connect to " + label
      }
      setInterval(() => {
        fetch(url, { mode: "no-cors", cache: "no-store" }).then(() => location.replace(url), () => {})
      }, 3000)
    </script>
  </body>
</html>
