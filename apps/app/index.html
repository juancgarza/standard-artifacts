<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Workspace</title>
    <!-- Before first paint, so a dark page never flashes white. theme.ts keeps it up to date from here on. -->
    <script>
      (function () {
        var theme
        try {
          theme = localStorage.getItem("standard-artifacts:theme")
        } catch (e) {}
        if (theme !== "light" && theme !== "dark") theme = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light"
        document.documentElement.dataset.theme = theme
        // The desktop app, so styles.css can make room for the window's controls.
        if (window.standardArtifactsDesktop) document.documentElement.dataset.desktop = window.standardArtifactsDesktop.platform
      })()
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/web/main.tsx"></script>
  </body>
</html>
